# Verifica y publica MEDIDA en Cloudflare en cada push a `main` o a una rama
# `claude/**`: lo que hay en la rama va al link principal (el Worker
# "medida"). La edición clásica queda guardada en edicion-clasica/ pero ya no
# se publica; el Worker "medida-nuevo" deja de actualizarse.
#
# El token de Cloudflare está cargado como secreto de un *environment* de
# GitHub (Settings -> Environments), no como secreto del repositorio. Un job
# solo ve esos secretos si declara el environment, así que el primer job
# averigua cómo se llama y se lo pasa al segundo.
#
# Si hay más de un environment, se elige con la variable del repositorio
# DEPLOY_ENVIRONMENT (Settings -> Secrets and variables -> Actions ->
# Variables).
#
# Secretos que lee (en el environment o en el repositorio):
#   CLOUDFLARE_API_TOKEN   obligatorio
#   CLOUDFLARE_ACCOUNT_ID  opcional: hace falta solo si el token ve más de
#                          una cuenta
#   RESEND_API_KEY         opcional: la clave de Resend. Con ella se activan el
#                          acceso por email y los recordatorios
# Variable opcional: EMAIL_FROM, el remitente ("MEDIDA <acceso@tu-dominio.com>")
name: Publicar MEDIDA

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: publicar-medida
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pruebas, tipos y lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Buscar el environment que tiene el token de Cloudflare
        id: environment
        env:
          GH_TOKEN: ${{ github.token }}
          PREFERRED: ${{ vars.DEPLOY_ENVIRONMENT }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/environments" --jq '.environments[].name' 2>/dev/null | grep -v '^github-pages$' || true)
          count=$(printf '%s\n' "$names" | grep -c . || true)
          if [ -n "$PREFERRED" ]; then
            name="$PREFERRED"
          elif [ "$count" -eq 1 ]; then
            name="$names"
          else
            name=$(printf '%s\n' "$names" | grep -i -m1 -E 'cloudflare|prod|deploy|medida' || true)
            [ -n "$name" ] || name=$(printf '%s\n' "$names" | head -n1)
          fi
          echo "Environments del repositorio: ${names:-ninguno}"
          echo "Se publica con: ${name:-ninguno (secretos del repositorio)}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  publicar:
    name: Publicar en Cloudflare
    needs: verificar
    runs-on: ubuntu-latest
    environment: ${{ needs.verificar.outputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No se encontró CLOUDFLARE_API_TOKEN. Cargalo como secreto del environment o del repositorio. MEDIDA no se publicó."
            exit 1
          fi
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          vars=()
          if [ -n "$EMAIL_FROM" ]; then vars=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          set -o pipefail
          # el link principal
          npx wrangler deploy "${vars[@]}" 2>&1 | tee deploy.log
          # la clave del proveedor de email, si está cargada, pasa al Worker como secreto
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi
          url=$(grep -o -m1 'https://[a-z0-9.-]*workers\.dev' deploy.log || true)
          echo "url=$url" >> "$GITHUB_ENV"

      - name: Comprobar que el sitio publicado responde
        run: |
          if [ -z "$url" ]; then
            echo "::warning::Se publicó, pero wrangler no informó la dirección: no se pudo comprobar."
            exit 0
          fi
          # la primera publicación de un subdominio puede tardar unos segundos
          answers() {
            local base=$1; shift
            for path in "$@"; do
              ok=""
              for attempt in 1 2 3 4 5 6; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path" || true)
                if [ "$code" = "200" ]; then ok=1; break; fi
                sleep 5
              done
              if [ -z "$ok" ]; then
                echo "::error::$base$path respondió $code"
                exit 1
              fi
              echo "$base$path -> 200"
            done
          }
          answers "$url" / /configuradores/ /servicios/ /demo/ /demo/mesas/ /demo/ratonas/ /demo/tv/ /demo/bibliotecas/ /demo/sillones/ /demo/camas/ /demo/taller/ /mis-disenos/ /cuenta/ /admin/ /panel/ /embed/ /privacidad/ /cookies/ /terminos/ /api/health /api/public/site
          # el link principal es esta versión: siete familias, sin el cartel de "en desarrollo" y se puede indexar
          home=$(curl -s "$url/")
          echo "$home" | grep -q "Infinitas configuraciones" || { echo "::error::La portada del link principal no es la de esta versión."; exit 1; }
          echo "$home" | grep -q "Siete familias" || { echo "::error::El link principal no es la edición nueva."; exit 1; }
          if echo "$home" | grep -q "En desarrollo"; then echo "::error::El link principal dice que está en desarrollo."; exit 1; fi
          if curl -s "$url/robots.txt" | grep -q "Disallow: /$"; then echo "::error::El link principal no se puede indexar."; exit 1; fi
          # el servidor: contesta, y sin sesión no entrega nada de nadie
          curl -s "$url/api/public/site" | tee site.json; echo
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/me")" = "401" ] || { echo "::error::/api/me sin sesión no respondió 401"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/admin/overview")" = "401" ] || { echo "::error::la administración quedó abierta"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/public/embed?t=no-existe")" = "404" ] || { echo "::error::el configurador embebido respondió por una empresa que no existe"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/panel")" = "401" ] || { echo "::error::el panel de empresa quedó abierto"; exit 1; }
          {
            echo "### MEDIDA publicado"
            echo "- Link principal: $url"
          } >> "$GITHUB_STEP_SUMMARY"
